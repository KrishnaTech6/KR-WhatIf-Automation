name: voiceover

# Claude commits runs/<slug>/voice/config.json, then starts this workflow.
# It runs the Chatterbox notebook on Kaggle's free GPU and returns the audio
# as the artifact "audio-<slug>" (final/*.wav, parts/, report.json, log.txt).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "run folder name under runs/"
        required: true
      only:
        description: 'redo run, e.g. {"main":[5]}  (empty = all beats)'
        required: false
        default: ""
      fetch_run:
        description: "copy only: id of an earlier voiceover run whose audio should be pushed to artifacts/<slug> (no Kaggle run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: kaggle-voiceover      # one Kaggle GPU run at a time
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      SLUG: ${{ inputs.slug }}
      ONLY: ${{ inputs.only }}
    steps:
      - name: Copy an earlier run's audio (fetch_run mode)
        if: inputs.fetch_run != ''
        uses: actions/download-artifact@v4
        with:
          name: audio-${{ inputs.slug }}
          run-id: ${{ inputs.fetch_run }}
          github-token: ${{ github.token }}
          path: out
      - name: Push copied audio to artifacts/<slug>
        if: inputs.fetch_run != ''
        run: |
          cd out && git init -q && git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "artifacts/$SLUG" && git add -A && git commit -qm "audio from run ${{ inputs.fetch_run }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "artifacts/$SLUG"
      - uses: actions/checkout@v4
        if: inputs.fetch_run == ''
      - uses: actions/setup-python@v5
        if: inputs.fetch_run == ''
        with:
          python-version: "3.12"
      - name: Kaggle login
        if: inputs.fetch_run == ''
        env:
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -n "$T" ]; then echo "KAGGLE_API_TOKEN=$T" >> "$GITHUB_ENV"
          elif [ "${K#KGAT_}" != "$K" ]; then echo "KAGGLE_API_TOKEN=$K" >> "$GITHUB_ENV"
          # new kaggle CLI ignores KAGGLE_KEY env; legacy keys only work from kaggle.json
          elif [ -n "$K" ]; then mkdir -p ~/.kaggle && umask 077 && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$K" > ~/.kaggle/kaggle.json
          else echo "::error::add the KAGGLE_API_TOKEN secret"; exit 1; fi
      - name: Install tools
        if: inputs.fetch_run == ''
        run: pip install -q kaggle six numpy soundfile
      - name: Build kernel
        if: inputs.fetch_run == ''
        run: |
          cfg=runs/$SLUG/voice/config.json
          if [ -n "$ONLY" ]; then
            python -c "import json,os,sys; c=json.load(open('$cfg')); c['only']=json.loads(os.environ['ONLY']); json.dump(c,open('/tmp/config.json','w'))"
          else
            cp "$cfg" /tmp/config.json
          fi
          python kaggle/build_kernel.py /tmp/config.json lexicon.json build "$KAGGLE_USERNAME"
      - name: Push to Kaggle (T4 GPU)
        if: inputs.fetch_run == ''
        run: kaggle kernels push -p build --accelerator NvidiaTeslaT4
      - name: Wait for the run
        if: inputs.fetch_run == ''
        run: |
          id="$KAGGLE_USERNAME/kr-voiceover"
          sleep 60
          for i in $(seq 1 280); do
            s=$(kaggle kernels status "$id" 2>&1 | tr 'A-Z' 'a-z')
            echo "$(date -u +%H:%M) $s"
            case "$s" in
              *complete*) exit 0 ;;
              *error*|*cancel*) echo "::error::Kaggle run failed: $s"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::Kaggle run did not finish in time"; exit 1
      - name: Download output
        if: always() && inputs.fetch_run == ''
        run: |
          mkdir -p out
          kaggle kernels output "$KAGGLE_USERNAME/kr-voiceover" -p out || true
          ls -R out | head -50
          test -f out/report.json && cat out/report.json | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always() && inputs.fetch_run == ''
        with:
          name: audio-${{ inputs.slug }}
          path: out/
          retention-days: 14
      - name: Also push the audio to artifacts/<slug> (git-fetchable)
        if: always() && inputs.fetch_run == '' && hashFiles('out/report.json') != ''
        run: |
          cd out && git init -q && git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "artifacts/$SLUG" && git add -A && git commit -qm "audio from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "artifacts/$SLUG"
