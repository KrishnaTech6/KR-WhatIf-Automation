name: publish-youtube

# No GitHub Releases (Krishna, 12 Nov 2026). Claude pushes MAIN.mp4, SHORT.mp4, REEL.mp4, the
# thumbnail, upload.json and upload_text.txt to the temporary branch "release-files/<slug>",
# then starts this workflow. It uploads to YouTube, commits runs/<slug>/published.json, and
# deletes the temporary branch once every video is up.
# cleanup_only=true just deletes the old GitHub Release <slug> (and its tag), if one exists.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "run folder name"
        required: true
      files_branch:
        description: "branch holding the files (default: release-files/<slug>)"
        required: false
        default: ""
      cleanup_only:
        description: "true = only delete the old GitHub Release + tag for this slug"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SLUG: ${{ inputs.slug }}
      FILES: ${{ inputs.files_branch || format('release-files/{0}', inputs.slug) }}
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete the old GitHub Release (cleanup_only)
        if: inputs.cleanup_only == 'true'
        run: |
          if gh release view "$SLUG" >/dev/null 2>&1; then gh release delete "$SLUG" --cleanup-tag -y && echo "deleted release $SLUG"
          else echo "no release named $SLUG"; fi
      - uses: actions/setup-python@v5
        if: inputs.cleanup_only != 'true'
        with:
          python-version: "3.12"
      - if: inputs.cleanup_only != 'true'
        run: pip install -q google-api-python-client google-auth
      - name: Get the files from the temporary branch
        if: inputs.cleanup_only != 'true'
        run: |
          git fetch -q origin "$FILES"
          mkdir -p assets && git archive FETCH_HEAD | tar -x -C assets
          ls -la assets
      - name: Upload to YouTube
        if: inputs.cleanup_only != 'true'
        run: python scripts/youtube_upload.py assets/upload.json assets "runs/$SLUG/published.json"
      - name: Save links
        if: always() && inputs.cleanup_only != 'true'
        run: |
          test -f "runs/$SLUG/published.json" || exit 0
          cat "runs/$SLUG/published.json"
          git config user.name "kr-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add "runs/$SLUG/published.json"
          git commit -m "published: $SLUG" || exit 0
          git pull --rebase -q && git push -q
      - name: Delete the temporary files branch (everything is on YouTube now)
        if: success() && inputs.cleanup_only != 'true'
        run: git push -q origin --delete "$FILES" || true
