name: publish-youtube

# Claude creates a GitHub Release tagged <slug> holding MAIN.mp4, SHORT.mp4, REEL.mp4,
# the thumbnail(s) and upload.json, then starts this workflow. The result is committed
# to runs/<slug>/published.json (links, and whether YouTube locked the uploads private).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "release tag = run folder name"
        required: true
      files_branch:
        description: "optional: branch holding the release files; the workflow then creates the Release itself"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SLUG: ${{ inputs.slug }}
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Create the Release from a files branch (sessions that cannot upload release assets)
        if: inputs.files_branch != ''
        run: |
          git fetch -q origin "${{ inputs.files_branch }}"
          mkdir -p assets && git archive FETCH_HEAD | tar -x -C assets
          ls -la assets
          title=$(python -c "import json;print(json.load(open('assets/upload.json'))['main']['title'])")
          gh release view "$SLUG" >/dev/null 2>&1 || gh release create "$SLUG" assets/* --title "$title" --notes "MAIN + SHORT + REEL, thumbnail, upload.json, upload_text.txt"
      - name: Get release files
        if: inputs.files_branch == ''
        run: gh release download "$SLUG" -D assets
      - name: Upload to YouTube
        run: python scripts/youtube_upload.py assets/upload.json assets "runs/$SLUG/published.json"
      - name: Save links
        if: always()
        run: |
          test -f "runs/$SLUG/published.json" || exit 0
          cat "runs/$SLUG/published.json"
          git config user.name "kr-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add "runs/$SLUG/published.json"
          git commit -m "published: $SLUG" || exit 0
          git pull --rebase -q && git push -q
