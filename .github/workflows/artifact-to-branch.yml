name: artifact-to-branch

# Copies a run's artifact onto the branch "artifacts/<slug>" so a Claude session
# (whose network can reach git but not the artifact blob store) can fetch it with git.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "workflow run id that produced the artifact"
        required: true
      name:
        description: "artifact name, e.g. audio-<slug>"
        required: true
      slug:
        description: "run folder name"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Push to branch
        env:
          SLUG: ${{ inputs.slug }}
          NAME: ${{ inputs.name }}
          RUN: ${{ inputs.run_id }}
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "artifacts/$SLUG"
          git add -A
          git commit -qm "$NAME from run $RUN"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "artifacts/$SLUG"
